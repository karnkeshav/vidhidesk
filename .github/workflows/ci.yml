name: CI — Lint, Test, Verify, Deploy Gate

# Sprint 3.5.5B. Extends the existing .github/workflows/recheck_citations.yml
# (a separate, unrelated nightly job) rather than replacing it.
#
# Pipeline: Lint -> Unit Tests -> Migration Verification -> Infrastructure
# Verification -> Deployment -> Runtime Verification.
#
# Honesty note (read before assuming this fully gates production
# deploys, and before trusting the rest of this note as current — see
# docs/40_Operations/Deployment.md for the authoritative, up-to-date
# story): Vercel auto-deploys the frontend directly from pushes to
# `main` via its own git integration, outside of GitHub Actions
# entirely. The backend no longer lives on Render (migrated to a GCP
# Compute Engine VM behind Caddy/HTTPS, 2026-09-05/06) and is deployed
# by .github/workflows/gcp-deploy.yml, which triggers on this workflow
# completing on `main` — so backend deploys ARE already gated on this
# workflow's jobs passing. What is NOT yet closed: Vercel's frontend
# auto-deploy is still independent of this workflow, so a bad frontend
# push can still reach production regardless of what CI reports, unless
# branch protection on `main` is configured to require this workflow's
# jobs to pass before merge (a repo settings change, not a file change,
# and not something this workflow can configure itself). See
# docs/40_Operations/Deployment_Verification_Guide.md for detail — this
# file implements everything that CAN be automated without that repo
# settings change, and does not pretend to implement the part that needs it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - name: Backend — import sanity (no dedicated Python linter configured yet)
        working-directory: api
        run: python -c "from app.main import app; print(len(app.routes), 'routes registered')"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  unit_tests:
    needs: lint
    runs-on: ubuntu-latest
    # Most of this suite is properly mocked (FakeDB + dependency_overrides)
    # and needs no real credentials, but a minority of tests exercise route
    # code that calls service_client() directly (e.g. matters.py's GET
    # /api/matters/{id}, which reads draft_versions) without mocking it --
    # those 32 tests failed with "supabase_key is required" in CI (the repo
    # never had SUPABASE_* secrets at all until this fix) even though they
    # pass locally wherever a root .env with real values is picked up.
    # Wiring the same real secrets infrastructure_verification already
    # uses is the pragmatic fix here, not retrofitting mocks into 32 tests
    # across 9 files in the same pass as unblocking the deploy pipeline.
    #
    # Same reasoning extends to the LLM provider keys: tests/test_golden.py
    # deliberately calls the real llm_gateway.generate() (see that file's
    # module docstring -- it's a golden/integration suite, not a unit test,
    # that exercises real completions on purpose). Without a real key the
    # gateway sends "Authorization: Bearer " with an empty token, which
    # httpcore rejects outright as an illegal header value before any
    # provider is even reached -- found 2026-09-07, same missing-secret
    # class of failure as the Supabase case above.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - run: python -m pytest tests/ -q
        working-directory: api
      - name: Frontend build (typecheck + static generation)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  migration_verification:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - name: Static migration file checks (no credentials needed)
        run: python scripts/verify_migrations.py
        working-directory: api

  infrastructure_verification:
    needs: unit_tests
    runs-on: ubuntu-latest
    # Requires real credentials as GitHub Secrets — same set the existing
    # recheck_citations.yml workflow already uses, extended with the LLM
    # provider keys. This job will FAIL if any of these secrets are
    # unset/wrong, per this project's "never produce a false PASS" rule —
    # it does not skip silently.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      INDIAN_KANOON_API_TOKEN: ${{ secrets.INDIAN_KANOON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - run: python scripts/verify_database.py
        working-directory: api
      - run: python scripts/verify_storage.py
        working-directory: api
      - run: python scripts/verify_llm_providers.py
        working-directory: api

  deploy_gate:
    needs: [migration_verification, infrastructure_verification]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment
        run: |
          echo "All upstream verification jobs passed."
          echo "NOTE: the GCP backend deploy (gcp-deploy.yml) is already gated on this"
          echo "workflow succeeding on main. Vercel's frontend deploy still auto-deploys"
          echo "from git push independently of this workflow."
          echo "To close that remaining gap, add branch protection on main requiring this"
          echo "workflow to pass before merge. See"
          echo "docs/40_Operations/Deployment_Verification_Guide.md for exact steps — not done"
          echo "in this workflow file because the repo-settings change can't be made from a"
          echo "file-only change."

  runtime_verification:
    needs: deploy_gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - name: Verify the actual deployed backend responds correctly
        working-directory: api
        env:
          # GCP Compute Engine VM behind Caddy/HTTPS, migrated from Render
          # 2026-09-05/06 -- see docs/40_Operations/Deployment.md.
          RUNTIME_VERIFY_BASE_URL: https://vidhidesk-api.duckdns.org
        run: python scripts/verify_runtime.py
